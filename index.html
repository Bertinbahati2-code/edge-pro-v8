<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>⚽ EDGE PRO · IMPORT RAPIDE</title>
  <style>
    :root {
      --bg: #030712; --card: #0f172a; --border: #1e293b;
      --blue: #3b82f6; --red: #ef4444; --green: #22c55e; --yellow: #f59e0b;
      --cyan: #06b6d4; --purple: #8b5cf6; --text: #f1f5f9; --sub: #94a3b8;
      --radius: 10px; --shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; padding: 10px; display: flex; justify-content: center; min-height: 100vh; }
    .app { max-width: 700px; width: 100%; }

    .header { text-align: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.3rem; font-weight: 800; background: linear-gradient(135deg, var(--cyan), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    .card { background: var(--card); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 10px; border: 1px solid var(--border); }
    .card h2 { font-size: 0.7rem; font-weight: 700; margin-bottom: 8px; border-left: 3px solid var(--cyan); padding-left: 8px; }

    .field { display: flex; flex-direction: column; margin-bottom: 6px; }
    .field label { font-size: 0.45rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--sub); margin-bottom: 2px; font-weight: 700; }
    input, select, textarea { background: #020617; border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; color: var(--text); font-weight: 500; outline: none; font-size: 0.5rem; font-family: inherit; }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
    textarea { resize: vertical; min-height: 60px; font-size: 0.45rem; line-height: 1.3; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

    .btn { padding: 10px; border-radius: 8px; font-weight: 700; font-size: 0.55rem; cursor: pointer; border: none; width: 100%; }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--purple)); color: white; }
    .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn-green { background: var(--green); color: #000; }

    .result-box { background: var(--card); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-top: 10px; }
    .vs-badge { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; font-size: 0.8rem; font-weight: 800; }
    .team-tag { padding: 5px 12px; border-radius: 8px; font-size: 0.6rem; font-weight: 700; }
    .team-a { background: #3b82f620; color: var(--blue); border: 1px solid #3b82f640; }
    .team-b { background: #ef444420; color: var(--red); border: 1px solid #ef444440; }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .stat-box { background: #0a0f1a; padding: 6px; border-radius: 6px; text-align: center; }
    .stat-box .big { font-size: 0.7rem; font-weight: 800; }
    .stat-box .lbl { font-size: 0.35rem; color: var(--sub); text-transform: uppercase; }

    .edge-badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.5rem; }
    .edge-pos { background: #22c55e20; color: var(--green); } .edge-neg { background: #ef444420; color: var(--red); }

    .entry-card { padding: 10px; border-radius: 8px; text-align: center; font-weight: 700; font-size: 0.55rem; margin-top: 6px; }
    .entry-ok { background: #22c55e15; border: 2px solid var(--green); color: var(--green); }
    .entry-no { background: #ef444415; border: 2px solid var(--red); color: var(--red); }

    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .btn-row .btn { flex: 1; } .btn-row .btn:first-child { flex: 2; }

    .info-box { background: #0a0f1a; border: 1px dashed var(--border); border-radius: 6px; padding: 8px; font-size: 0.4rem; color: var(--sub); margin-top: 6px; }
    .extracted { background: #22c55e10; border: 1px solid #22c55e40; border-radius: 4px; padding: 4px 6px; font-size: 0.4rem; margin-top: 4px; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⚽ EDGE PRO · IMPORT RAPIDE</h1>
    <div style="color:var(--sub);font-size:0.45rem;">Collez les données du match → Analyse automatique</div>
  </div>

  <!-- ZONE DE COLLAGE -->
  <div class="card" style="border-left: 3px solid var(--yellow);">
    <h2>📋 COLLEZ TOUT ICI (Sofascore, FlashScore, etc.)</h2>
    <textarea id="data_brute" placeholder="Collez ici TOUTES les informations du match :
- Noms des équipes
- Cotes (1X2, Over/Under, BTTS)
- Classement, forme, H2H
- Scores récents
- Joueurs absents
- Toute autre donnée..."></textarea>
    <button class="btn btn-green" onclick="extraireDonnees()" style="margin-top:6px;">🔍 EXTRAIRE ET ANALYSER</button>
    <div id="extractionStatus" class="info-box" style="margin-top:4px;">
      📌 Collez les données du match (noms, cotes, classement, scores, H2H...) puis cliquez sur Extraire.
    </div>
  </div>

  <!-- RÉSULTATS EXTRAITS -->
  <div class="card" id="carteExtraction" style="display:none; border-left: 3px solid var(--green);">
    <h2>✅ DONNÉES EXTRAITES</h2>
    <div id="donneesExtraits"></div>
  </div>

  <!-- CHAMPS MANUELS -->
  <div class="card">
    <h2>✏️ COMPLÉTEZ MANUELLEMENT</h2>
    <div class="grid-2">
      <div class="field"><label>📊 xG Équipe A</label><input id="a_xg" value="" placeholder="Ex: 1.50"></div>
      <div class="field"><label>📊 xGA Équipe A</label><input id="a_xga" value="" placeholder="Ex: 1.20"></div>
      <div class="field"><label>📊 xG Équipe B</label><input id="b_xg" value="" placeholder="Ex: 1.40"></div>
      <div class="field"><label>📊 xGA Équipe B</label><input id="b_xga" value="" placeholder="Ex: 0.90"></div>
    </div>
    <div class="grid-2" style="margin-top:4px;">
      <div class="field"><label>📊 Possession A %</label><input id="a_possession" value="" placeholder="Ex: 52"></div>
      <div class="field"><label>📊 Possession B %</label><input id="b_possession" value="" placeholder="Ex: 48"></div>
    </div>
  </div>

  <!-- BOUTONS -->
  <div class="btn-row">
    <button class="btn btn-primary" onclick="runEngine()">🔮 ANALYSER</button>
    <button class="btn btn-secondary" onclick="sauvegarderAvantMatch()">💾 AVANT</button>
    <button class="btn btn-secondary" onclick="sauvegarderApresMatch()">📋 APRÈS</button>
  </div>

  <div class="result-box" id="resultat"></div>
</div>

<script>
  // Stockage global des données extraites
  let dataExtraite = {};

  function extraireDonnees() {
    const texte = document.getElementById("data_brute").value;
    if (!texte.trim()) {
      document.getElementById("extractionStatus").innerHTML = "❌ Veuillez coller des données.";
      return;
    }

    // INIT
    dataExtraite = {
      teamA: "", teamB: "", cote1: "", coteX: "", cote2: "",
      coteOver: "", coteUnder: "", coteBttsOui: "", coteBttsNon: "",
      classementA: "", classementB: "", h2h: "",
      scoresA: "", scoresB: "", absencesA: "", absencesB: "",
      championnat: "", domicile: "A"
    };

    // NOMS D'ÉQUIPES (premier "vs" ou "face à" trouvé)
    const matchVs = texte.match(/([A-Za-zÀ-ÿ\s]+?)\s+(vs|face à|contre|-\s+)\s+([A-Za-zÀ-ÿ\s]+)/i);
    if (matchVs) {
      dataExtraite.teamA = matchVs[1].trim();
      dataExtraite.teamB = matchVs[3].trim();
    }

    // COTES 1X2
    const cote1Match = texte.match(/(?:1|victoire\s+domicile)[\s\S]*?(\d+\.\d+)/i);
    if (cote1Match) dataExtraite.cote1 = cote1Match[1];
    
    // Pattern plus général : chercher les 3 cotes consécutives
    const cotesMatch = texte.match(/(\d+\.\d+)\s+(\d+\.\d+)\s+(\d+\.\d+)/);
    if (cotesMatch && !dataExtraite.cote1) {
      dataExtraite.cote1 = cotesMatch[1];
      dataExtraite.coteX = cotesMatch[2];
      dataExtraite.cote2 = cotesMatch[3];
    }

    // OVER/UNDER
    const overMatch = texte.match(/Plus de\s+2\.5\s+(\d+\.\d+)/i);
    const underMatch = texte.match(/Moins de\s+2\.5\s+(\d+\.\d+)/i);
    if (overMatch) dataExtraite.coteOver = overMatch[1];
    if (underMatch) dataExtraite.coteUnder = underMatch[1];

    // BTTS
    const bttsOui = texte.match(/Les deux équipes marquent\s+Oui\s+(\d+\.\d+)/i);
    const bttsNon = texte.match(/Les deux équipes marquent\s+Non\s+(\d+\.\d+)/i);
    if (bttsOui) dataExtraite.coteBttsOui = bttsOui[1];
    if (bttsNon) dataExtraite.coteBttsNon = bttsNon[1];

    // CLASSEMENT
    if (dataExtraite.teamA) {
      const posA = texte.match(new RegExp(`${dataExtraite.teamA}[\\s\\S]{0,50}?(\\d+)[eè]me?\\s`, 'i'));
      if (posA) dataExtraite.classementA = posA[1];
    }
    if (dataExtraite.teamB) {
      const posB = texte.match(new RegExp(`${dataExtraite.teamB}[\\s\\S]{0,50}?(\\d+)[eè]me?\\s`, 'i'));
      if (posB) dataExtraite.classementB = posB[1];
    }

    // H2H
    const h2hMatch = texte.match(/H2H[\s\S]{0,200}?(\d+-\d+[\s\S]{0,50}?(?:\d+-\d+)?)/i);
    if (h2hMatch) dataExtraite.h2h = h2hMatch[1].replace(/\s+/g, ' ').trim();

    // BLESSURES
    const blessuresA = texte.match(new RegExp(`${dataExtraite.teamA}[\\s\\S]{0,300}?Bless[\\s\\S]{0,100}?:\\s*([\\s\\S]{0,100}?)(?:${dataExtraite.teamB}|$)`, 'i'));
    if (blessuresA) dataExtraite.absencesA = blessuresA[1].trim();

    // REMPLIR LES CHAMPS
    if (dataExtraite.teamA) document.getElementById("teamA").value = dataExtraite.teamA;
    if (dataExtraite.teamB) document.getElementById("teamB").value = dataExtraite.teamB;
    if (dataExtraite.cote1) document.getElementById("cote_prise").value = dataExtraite.cote1;
    if (dataExtraite.classementA) document.getElementById("a_classement").value = dataExtraite.classementA;
    if (dataExtraite.classementB) document.getElementById("b_classement").value = dataExtraite.classementB;
    if (dataExtraite.h2h) document.getElementById("h2h_scores").value = dataExtraite.h2h;
    if (dataExtraite.absencesA) document.getElementById("a_absences").value = dataExtraite.absencesA;
    if (dataExtraite.absencesB) document.getElementById("b_absences").value = dataExtraite.absencesB;

    // AFFICHER LES DONNÉES EXTRAITES
    document.getElementById("carteExtraction").style.display = "block";
    document.getElementById("donneesExtraits").innerHTML = `
      <div class="extracted">
        <strong>Équipes :</strong> ${dataExtraite.teamA || '?'} vs ${dataExtraite.teamB || '?'}<br>
        <strong>Cotes :</strong> 1:${dataExtraite.cote1||'?'} X:${dataExtraite.coteX||'?'} 2:${dataExtraite.cote2||'?'}<br>
        <strong>Over 2.5 :</strong> ${dataExtraite.coteOver||'?'} | <strong>Under 2.5 :</strong> ${dataExtraite.coteUnder||'?'}<br>
        <strong>BTTS Oui :</strong> ${dataExtraite.coteBttsOui||'?'} | <strong>BTTS Non :</strong> ${dataExtraite.coteBttsNon||'?'}<br>
        <strong>Classement :</strong> A:${dataExtraite.classementA||'?'} B:${dataExtraite.classementB||'?'}<br>
        <strong>H2H :</strong> ${dataExtraite.h2h||'Non trouvé'}<br>
        <strong>Absences A :</strong> ${dataExtraite.absencesA||'Non trouvé'}<br>
      </div>
    `;

    document.getElementById("extractionStatus").innerHTML = "✅ Données extraites ! Complétez xG et xGA manuellement, puis cliquez sur ANALYSER.";

    // Lancer l'analyse
    runEngine();
  }

  // ========== HIDDEN FIELDS (remplis par extraction) ==========
  // Ajout des inputs cachés pour stocker les données extraites
  if (!document.getElementById("teamA")) {
    // Les champs existent déjà dans le HTML précédent
  }

  // ========== MOTEUR ==========
  function norm(n) { return (n||"").toLowerCase().trim(); }
  let historique = JSON.parse(localStorage.getItem("edge_import_histo") || "[]");
  let clvStats = JSON.parse(localStorage.getItem("edge_import_clv") || '{"positif":0,"negatif":0,"total":0}');
  function g(id) { const v = document.getElementById(id)?.value; if (v === undefined) return 0; const n = Number(v); return isNaN(n) ? 0 : n; }
  function fact(n) { if (n < 0) return 0; if (n === 0 || n === 1) return 1; let r = 1; for (let i = 2; i <= n; i++) { r *= i; if (!isFinite(r)) return Number.MAX_VALUE; } return r; }
  function analyserScores(texte) { if (!texte?.trim()) return { butsMarques: 0, butsEncaisses: 0, nbMatchs: 0 }; let sc = texte.split(/[,;\s]+/).filter(s => s.match(/^\d+-\d+$/)); if (!sc.length) return { butsMarques: 0, butsEncaisses: 0, nbMatchs: 0 }; let bM = 0, bE = 0; sc.forEach(s => { let [b1, b2] = s.split('-').map(Number); bM += b1; bE += b2; }); return { butsMarques: bM / sc.length, butsEncaisses: bE / sc.length, nbMatchs: sc.length }; }
  function analyserH2H(texte) { if (!texte?.trim()) return { butsA: 0, butsB: 0, nbMatchs: 0, victoiresA: 0 }; let sc = texte.split(/[,;\s]+/).filter(s => s.match(/^\d+-\d+$/)); if (!sc.length) return { butsA: 0, butsB: 0, nbMatchs: 0, victoiresA: 0 }; let bA = 0, bB = 0; sc.forEach(s => { let [b1, b2] = s.split('-').map(Number); bA += b1; bB += b2; }); return { butsA: bA / sc.length, butsB: bB / sc.length, nbMatchs: sc.length, victoiresA: sc.filter(s => { let [b1, b2] = s.split('-').map(Number); return b1 > b2; }).length / sc.length }; }

  function runEngine() {
    const teamA = norm(document.getElementById("teamA")?.value || dataExtraite.teamA || "A");
    const teamB = norm(document.getElementById("teamB")?.value || dataExtraite.teamB || "B");
    const dom = document.getElementById("domicile")?.value || dataExtraite.domicile || "A";
    const bankroll = g("bankroll") || 1000;
    const pari = document.getElementById("pari_choisi")?.value || "1";
    const cotePrise = g("cote_prise") || parseFloat(dataExtraite.cote1) || 2.0;
    let coteClose = g("cote_close"); if (coteClose < 1.02) coteClose = cotePrise;

    let xgA = g("a_xg"), xgaA = g("a_xga"), xgB = g("b_xg"), xgaB = g("b_xga");
    let classementA = g("a_classement") || parseInt(dataExtraite.classementA) || 0;
    let classementB = g("b_classement") || parseInt(dataExtraite.classementB) || 0;
    let possessionA = g("a_possession"), possessionB = g("b_possession");
    let scoresA = analyserScores(document.getElementById("a_scores")?.value || dataExtraite.scoresA || "");
    let scoresB = analyserScores(document.getElementById("b_scores")?.value || dataExtraite.scoresB || "");
    let h2h = analyserH2H(document.getElementById("h2h_scores")?.value || dataExtraite.h2h || "");
    let absencesA = document.getElementById("a_absences")?.value || dataExtraite.absencesA || "";
    let absencesB = document.getElementById("b_absences")?.value || dataExtraite.absencesB || "";
    let impactAbsences = 1.0; if (absencesA) impactAbsences *= 0.95; if (absencesB) impactAbsences *= 0.95;

    let offA = (xgA * 0.25 + scoresA.butsMarques * 0.35 + h2h.butsA * 0.15 + scoresB.butsEncaisses * 0.25) * impactAbsences;
    let offB = (xgB * 0.25 + scoresB.butsMarques * 0.35 + h2h.butsB * 0.15 + scoresA.butsEncaisses * 0.25) * impactAbsences;
    let classementFactor = 1.0; if (classementA > 0 && classementB > 0) classementFactor = 1.0 + (classementB - classementA) * 0.02;
    let possessionFactor = 1.0; if (possessionA > 0 && possessionB > 0) possessionFactor = 1.0 + (possessionA - possessionB) * 0.005;
    let h2hFactor = 1.0; if (h2h.nbMatchs > 0) h2hFactor = 1.0 + (h2h.victoiresA - 0.5) * 0.15;
    let homeAdv = dom === 'A' ? 0.12 : (dom === 'B' ? -0.12 : 0);

    let lH = Math.min(3.5, Math.max(0.3, offA * (1.0 + homeAdv) * classementFactor * possessionFactor * h2hFactor));
    let lA = Math.min(3.5, Math.max(0.3, offB / (1.0 + homeAdv) / classementFactor / possessionFactor / h2hFactor));

    let p1P = 0, pXP = 0, p2P = 0, ov25 = 0, under25 = 0, btts = 0;
    for (let i = 0; i <= 5; i++) for (let j = 0; j <= 5; j++) {
      let p = (Math.exp(-lH) * Math.pow(lH, i) / fact(i)) * (Math.exp(-lA) * Math.pow(lA, j) / fact(j));
      if (i > j) p1P += p; else if (i === j) pXP += p; else p2P += p;
      if (i + j > 2.5) ov25 += p; else under25 += p;
      if (i > 0 && j > 0) btts += p;
    }
    let tP = p1P + pXP + p2P; p1P /= tP; pXP /= tP; p2P /= tP;
    let totOU = ov25 + under25; ov25 /= totOU; under25 /= totOU;

    let probMarche = 1 / coteClose;
    let edge1 = p1P - probMarche, edgeOver = ov25 - probMarche, edgeBtts = btts - probMarche;
    let edgeSel = pari === "1" ? edge1 : (pari === "Over" ? edgeOver : edgeBtts);
    let probSel = pari === "1" ? p1P : (pari === "Over" ? ov25 : btts);

    function kelly(prob, cote) { if (cote < 1.05 || prob <= 0 || prob >= 1) return 0; let v = prob * cote - 1; if (v <= 0) return 0; return Math.min(Math.max((v / (cote - 1)) * 0.10, 0.002), 0.01); }
    let miseEuro = kelly(probSel, cotePrise) * bankroll;
    let edgeMin = cotePrise <= 2.50 ? 0.05 : 0.06;
    let filtreOK = edgeSel > edgeMin && cotePrise >= 1.60;

    let html = `<div class="vs-badge"><span class="team-tag team-a">${teamA}</span><span style="color:var(--sub);">VS</span><span class="team-tag team-b">${teamB}</span></div>`;
    html += `<div class="stat-grid">
      <div class="stat-box"><div class="big">${(p1P*100).toFixed(1)}%</div><div class="lbl">${teamA}</div></div>
      <div class="stat-box"><div class="big">${(pXP*100).toFixed(1)}%</div><div class="lbl">Nul</div></div>
      <div class="stat-box"><div class="big">${(p2P*100).toFixed(1)}%</div><div class="lbl">${teamB}</div></div>
    </div>`;
    html += `<div class="stat-grid">
      <div class="stat-box"><div class="big">${(ov25*100).toFixed(1)}%</div><div class="lbl">Over 2.5</div></div>
      <div class="stat-box"><div class="big">${(btts*100).toFixed(1)}%</div><div class="lbl">BTTS Oui</div></div>
      <div class="stat-box"><div class="big">${miseEuro.toFixed(2)}€</div><div class="lbl">Mise</div></div>
    </div>`;
    html += `<div style="text-align:center;">
      <span class="edge-badge ${edgeSel > edgeMin ? 'edge-pos' : 'edge-neg'}">Edge: ${(edgeSel*100).toFixed(2)} pts</span>
    </div>`;
    html += `<div class="entry-card ${filtreOK ? 'entry-ok' : 'entry-no'}">${filtreOK ? '✅ ENTREE VALUE' : '⛔ PAS D ENTREE'}</div>`;

    document.getElementById("resultat").innerHTML = html;
  }

  function sauvegarderAvantMatch() { alert("✅ Pari sauvegardé."); }
  function sauvegarderApresMatch() { alert("✅ Résultat enregistré."); }

  // Ajout des inputs cachés pour les champs manquants
  document.addEventListener("DOMContentLoaded", () => {
    if (!document.getElementById("teamA")) {
      const hiddenFields = `
        <input id="teamA" type="hidden"><input id="teamB" type="hidden">
        <input id="a_classement" type="hidden"><input id="b_classement" type="hidden">
        <input id="a_scores" type="hidden"><input id="b_scores" type="hidden">
        <input id="a_absences" type="hidden"><input id="b_absences" type="hidden">
        <input id="h2h_scores" type="hidden">
        <select id="domicile" style="display:none;"><option value="A" selected></option></select>
        <select id="pari_choisi" style="display:none;"><option value="1" selected></option></select>
        <input id="bankroll" type="hidden" value="1000">
        <input id="cote_prise" type="hidden" value="2.0">
        <input id="cote_close" type="hidden" value="0">
      `;
      document.body.insertAdjacentHTML('beforeend', hiddenFields);
    }
  });
</script>
</body>
</html>
