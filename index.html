<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>⚽ EDGE PRO V8 · ULTIMATE API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #020617; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; padding: 4px; display: flex; justify-content: center; }
    .app { max-width: 900px; width: 100%; }
    h1 { font-size: 1.2rem; font-weight: 700; text-align: center; background: linear-gradient(135deg, #00f2ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #94a3b8; margin-bottom: 6px; font-size: 0.5rem; }
    .card { background: #0f172a; border-radius: 8px; padding: 6px 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.7); margin-bottom: 6px; }
    .card h2 { font-size: 0.65rem; margin-bottom: 4px; border-left: 2px solid #00f2ff; padding-left: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 3px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 3px; }
    .stat-row { display: flex; flex-direction: column; margin-bottom: 4px; }
    .stat-row label { font-size: 0.4rem; text-transform: uppercase; letter-spacing: 0.2px; color: #94a3b8; margin-bottom: 1px; font-weight: 600; }
    input, select, textarea { background: #020617; border: 1px solid #334155; border-radius: 4px; padding: 4px 6px; color: #f1f5f9; font-weight: 500; outline: none; font-size: 0.5rem; }
    input:focus, select:focus, textarea:focus { border-color: #00f2ff; }
    textarea { resize: vertical; min-height: 35px; font-size: 0.45rem; }
    button { width: 100%; background: linear-gradient(135deg, #00e0ff, #7c3aed); border: none; padding: 6px; border-radius: 6px; font-weight: 700; font-size: 0.6rem; color: #0f172a; margin-top: 4px; cursor: pointer; }
    button:hover { background: linear-gradient(135deg, #38f0ff, #8b5cf6); }
    .btn-sm { padding: 3px 6px; font-size: 0.45rem; width: auto; display: inline-block; margin: 2px; border-radius: 4px; background: #1e293b; color: #e2e8f0; border: none; cursor: pointer; }
    .btn-auto { background: #0f172a; color: #00f2ff; border: 1px solid #00f2ff; padding: 3px 6px; font-size: 0.4rem; border-radius: 4px; cursor: pointer; margin: 2px; }
    .btn-auto:hover { background: #00f2ff20; }
    .result-box { background: #0b1120; border-radius: 6px; padding: 8px; margin-top: 6px; }
    .edge-pos { color: #4ade80; } .edge-neg { color: #f87171; }
    .entry-ok { background: #14532d15; border: 2px solid #4ade80; border-radius: 6px; padding: 6px; margin: 4px 0; text-align: center; font-weight: 700; }
    .entry-no { background: #1e293b; border-radius: 6px; padding: 6px; margin: 4px 0; text-align: center; opacity: 0.7; }
    .hist-item { background: #1e293b; padding: 3px 5px; border-radius: 4px; margin: 2px 0; font-size: 0.4rem; }
    .avertissement { font-size: 0.35rem; color: #64748b; margin-top: 4px; text-align: center; }
    .team-left { border-left: 2px solid #3b82f6; padding-left: 4px; }
    .team-right { border-left: 2px solid #ef4444; padding-left: 4px; }
    .pari-attente { background: #1e293b; padding: 6px; border-radius: 6px; margin-bottom: 6px; font-size: 0.5rem; border-left: 3px solid #fbbf24; }
    canvas { width: 100%; height: 150px; background: #0a0f1a; border-radius: 6px; margin-top: 6px; }
    .badge-rank { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.5rem; font-weight: 700; }
    .rank-ap { background: #4ade80; color: #000; } .rank-a { background: #22c55e; color: #000; }
    .rank-b { background: #fbbf24; color: #000; } .rank-c { background: #f97316; color: #000; }
    .rank-d { background: #ef4444; color: #fff; }
    .loading { color: #fbbf24; animation: pulse 1s infinite; }
    .auto-badge { background: #00f2ff20; color: #00f2ff; font-size: 0.35rem; padding: 1px 4px; border-radius: 3px; display: inline-block; margin-left: 4px; }
    .manuel-badge { background: #fbbf2420; color: #fbbf24; font-size: 0.35rem; padding: 1px 4px; border-radius: 3px; display: inline-block; margin-left: 4px; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
    @media (max-width: 600px) { .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
<div class="app">
  <h1>⚽ EDGE PRO V8 · ULTIMATE API</h1>
  <div class="subtitle">Football-Data.org (Auto) + Saisie Manuelle · Classement · Scores</div>

  <div id="pariEnAttente" class="pari-attente"></div>

  <!-- MATCH -->
  <div class="card">
    <h2>⚡ MATCH</h2>
    <div class="grid-2">
      <div class="team-left">
        <div class="stat-row"><label>🟦 Équipe A</label><input id="teamA" value="" placeholder="Équipe A...">
          <button class="btn-auto" onclick="autoRemplirStats('A')" style="width:auto;margin-top:2px;">🔄 AUTO-REMPLIR (API)</button>
        </div>
      </div>
      <div class="team-right">
        <div class="stat-row"><label>🟥 Équipe B</label><input id="teamB" value="" placeholder="Équipe B...">
          <button class="btn-auto" onclick="autoRemplirStats('B')" style="width:auto;margin-top:2px;">🔄 AUTO-REMPLIR (API)</button>
        </div>
      </div>
    </div>
    <div class="grid-3" style="margin-top:4px;">
      <div class="stat-row"><label>🏆 Championnat</label><select id="championnat"><option>Premier League</option><option>Liga</option><option>Serie A</option><option>Bundesliga</option><option>Ligue 1</option><option>Autre</option></select></div>
      <div class="stat-row"><label>🏟️ Domicile</label><select id="domicile"><option value="A" selected>A</option><option value="B">B</option><option value="N">Neutre</option></select></div>
      <div class="stat-row"><label>🎯 Marché</label><select id="pari_choisi" onchange="runEngine()"><option value="1">1 (A gagne)</option><option value="X">X (Nul)</option><option value="2">2 (B gagne)</option><option value="Over">Over 2.5</option><option value="Under">Under 2.5</option><option value="BTTS">BTTS Oui</option></select></div>
    </div>
    <div class="grid-3" style="margin-top:4px;">
      <div class="stat-row"><label>📈 Cote Prise</label><input id="cote_prise" value="2.20"></div>
      <div class="stat-row"><label>📉 Cote Close (optionnel)</label><input id="cote_close" value="" placeholder="Après match"></div>
      <div class="stat-row"><label>💰 Bankroll (€)</label><input id="bankroll" value="1000"></div>
    </div>
  </div>

  <!-- ÉQUIPES -->
  <div class="grid-2">
    <div class="card team-left">
      <h2>🟦 <span id="nomA"></span></h2>
      <div class="stat-row"><label>📊 xG<span class="manuel-badge">MANUEL</span></label><input id="a_xg" value="" placeholder="Ex: 1.88"></div>
      <div class="stat-row"><label>📊 xGA<span class="manuel-badge">MANUEL</span></label><input id="a_xga" value="" placeholder="Ex: 1.02"></div>
      <div class="stat-row"><label>📋 Classement<span class="auto-badge">AUTO</span></label><input id="a_classement" value="" placeholder="Auto-rempli par API"></div>
      <div class="stat-row"><label>📊 Possession %<span class="manuel-badge">MANUEL</span></label><input id="a_possession" value="" placeholder="Ex: 54"></div>
      <div class="stat-row"><label>⚽ 10 derniers scores<span class="auto-badge">AUTO</span></label><textarea id="a_scores" placeholder="Auto-rempli par API (modifiable)"></textarea></div>
      <div class="stat-row"><label>🩼 Joueurs absents<span class="manuel-badge">MANUEL</span></label><input id="a_absences" value="" placeholder="Ex: Saka, Havertz"></div>
    </div>
    <div class="card team-right">
      <h2>🟥 <span id="nomB"></span></h2>
      <div class="stat-row"><label>📊 xG<span class="manuel-badge">MANUEL</span></label><input id="b_xg" value="" placeholder="Ex: 1.52"></div>
      <div class="stat-row"><label>📊 xGA<span class="manuel-badge">MANUEL</span></label><input id="b_xga" value="" placeholder="Ex: 1.33"></div>
      <div class="stat-row"><label>📋 Classement<span class="auto-badge">AUTO</span></label><input id="b_classement" value="" placeholder="Auto-rempli par API"></div>
      <div class="stat-row"><label>📊 Possession %<span class="manuel-badge">MANUEL</span></label><input id="b_possession" value="" placeholder="Ex: 48"></div>
      <div class="stat-row"><label>⚽ 10 derniers scores<span class="auto-badge">AUTO</span></label><textarea id="b_scores" placeholder="Auto-rempli par API (modifiable)"></textarea></div>
      <div class="stat-row"><label>🩼 Joueurs absents<span class="manuel-badge">MANUEL</span></label><input id="b_absences" value="" placeholder="Ex: Palmer, Sanchez"></div>
    </div>
  </div>

  <!-- H2H -->
  <div class="card">
    <h2>🤝 H2H - 5 derniers face à face<span class="manuel-badge">MANUEL</span></h2>
    <div class="stat-row"><label>Scores exacts (A-B, A-B...)</label><textarea id="h2h_scores" placeholder="2-1, 1-1, 0-2, 3-1, 2-2" style="min-height:30px;"></textarea></div>
  </div>

  <div style="display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;">
    <button onclick="runEngine()" style="background:#7c3aed;flex:2;">🔮 ANALYSER</button>
    <button onclick="sauvegarderAvantMatch()" class="btn-sm" style="flex:1;">💾 AVANT</button>
    <button onclick="sauvegarderApresMatch()" class="btn-sm" style="flex:1;">📋 APRÈS</button>
    <button onclick="exporterCSV()" class="btn-sm" style="flex:0.5;">📤</button>
  </div>

  <div class="card"><h2>📋 APRÈS MATCH<span class="manuel-badge">MANUEL</span></h2>
    <div class="grid-3">
      <div class="stat-row"><label>Résultat</label><select id="resultat_reel"><option value="">?</option><option value="1">1</option><option value="X">X</option><option value="2">2</option></select></div>
      <div class="stat-row"><label>⚽ Buts A</label><input id="butsA_reels" placeholder="2"></div>
      <div class="stat-row"><label>⚽ Buts B</label><input id="butsB_reels" placeholder="1"></div>
    </div>
  </div>

  <div class="result-box" id="resultat"></div>

  <div class="card"><h2>📈 COURBE DE PROGRESSION</h2><canvas id="graphBankroll" height="150"></canvas></div>
  <div class="card"><h2>📊 HISTORIQUE</h2><div id="clvSummary" style="font-size:0.4rem;"></div><div id="alerteRisque" style="font-size:0.4rem;"></div><div id="historique"></div></div>
  <div class="avertissement">⚠️ Outil d'aide à la décision uniquement. <span class="auto-badge">AUTO</span> = API | <span class="manuel-badge">MANUEL</span> = À remplir</div>
</div>

<script>
  // ========== CONFIGURATION API ==========
  const API_KEY = "f94167717c7a462889707f03a5b99963";
  const API_BASE = "https://api.football-data.org/v4";
  let cacheAPI = {};

  const codesChampionnats = {
    "Premier League": "PL", "Liga": "PD", "Serie A": "SA", "Bundesliga": "BL1", "Ligue 1": "FL1"
  };

  // ========== FONCTIONS API ==========
  async function rechercherEquipe(nom) {
    const cacheKey = `search_${nom}`;
    if (cacheAPI[cacheKey] && Date.now() - cacheAPI[cacheKey].time < 600000) return cacheAPI[cacheKey].data;
    try {
      const response = await fetch(`${API_BASE}/teams?search=${encodeURIComponent(nom)}&limit=3`, { headers: { "X-Auth-Token": API_KEY } });
      const data = await response.json();
      cacheAPI[cacheKey] = { data, time: Date.now() };
      return data;
    } catch (e) { return null; }
  }

  async function getMatchsTermines(equipeId) {
    const cacheKey = `matchs_${equipeId}`;
    if (cacheAPI[cacheKey] && Date.now() - cacheAPI[cacheKey].time < 300000) return cacheAPI[cacheKey].data;
    try {
      const response = await fetch(`${API_BASE}/teams/${equipeId}/matches?limit=10&status=FINISHED`, { headers: { "X-Auth-Token": API_KEY } });
      const data = await response.json();
      cacheAPI[cacheKey] = { data, time: Date.now() };
      return data;
    } catch (e) { return null; }
  }

  async function getClassement(codeChamp) {
    const cacheKey = `classement_${codeChamp}`;
    if (cacheAPI[cacheKey] && Date.now() - cacheAPI[cacheKey].time < 600000) return cacheAPI[cacheKey].data;
    try {
      const response = await fetch(`${API_BASE}/competitions/${codeChamp}/standings`, { headers: { "X-Auth-Token": API_KEY } });
      const data = await response.json();
      cacheAPI[cacheKey] = { data, time: Date.now() };
      return data;
    } catch (e) { return null; }
  }

  function trouverClassement(classementData, equipeId) {
    if (!classementData || !classementData.standings) return null;
    for (let standing of classementData.standings) {
      for (let row of standing.table) {
        if (row.team.id === equipeId) return { position: row.position };
      }
    }
    return null;
  }

  function extraireStatsMatchs(data, equipeId) {
    if (!data || !data.matches) return null;
    let butsMarques = 0, butsEncaisses = 0, scoresTexte = [];
    data.matches.forEach(match => {
      const score = match.score.fullTime;
      if (score.home === null || score.away === null) return;
      if (match.homeTeam.id === equipeId) {
        butsMarques += score.home; butsEncaisses += score.away;
        scoresTexte.push(`${score.home}-${score.away}`);
      } else {
        butsMarques += score.away; butsEncaisses += score.home;
        scoresTexte.push(`${score.away}-${score.home}`);
      }
    });
    const nbMatchs = scoresTexte.length || 1;
    return { scoresTexte: scoresTexte.join(", "), nbMatchs };
  }

  async function autoRemplirStats(prefix) {
    const nomEquipe = document.getElementById(`team${prefix.toUpperCase()}`).value.trim();
    if (!nomEquipe || nomEquipe.length < 3) { alert("Veuillez entrer un nom d'équipe (min 3 caractères)"); return; }
    document.getElementById(`nom${prefix.toUpperCase()}`).innerHTML = `<span class="loading">${nomEquipe} ⏳</span>`;

    const recherche = await rechercherEquipe(nomEquipe);
    if (!recherche || !recherche.teams || recherche.teams.length === 0) {
      document.getElementById(`nom${prefix.toUpperCase()}`).innerHTML = nomEquipe;
      alert("Équipe non trouvée. Vérifiez le nom.");
      return;
    }
    const equipe = recherche.teams[0];

    // Scores
    const matchs = await getMatchsTermines(equipe.id);
    const stats = extraireStatsMatchs(matchs, equipe.id);
    if (stats) document.getElementById(`${prefix}_scores`).value = stats.scoresTexte;

    // Classement
    const championnat = document.getElementById("championnat").value;
    const codeChamp = codesChampionnats[championnat];
    if (codeChamp) {
      const classementData = await getClassement(codeChamp);
      const pos = trouverClassement(classementData, equipe.id);
      if (pos) document.getElementById(`${prefix}_classement`).value = pos.position;
    }

    document.getElementById(`nom${prefix.toUpperCase()}`).innerHTML = nomEquipe;
    runEngine();
    alert(`✅ ${nomEquipe} : Scores et classement auto-remplis !\n⚠️ Remplissez xG, xGA et Possession manuellement.`);
  }

  // ========== MOTEUR DE CALCUL ==========
  function norm(n) { return n.toLowerCase().trim(); }
  let historique = JSON.parse(localStorage.getItem("edge_v8_histo") || "[]");
  let clvStats = JSON.parse(localStorage.getItem("edge_v8_clv") || '{"positif":0,"negatif":0,"total":0}');

  function g(id) { const v = document.getElementById(id)?.value; if (v === undefined) return 0; const n = Number(v); return isNaN(n) ? 0 : n; }
  function fact(n) { if (n < 0) return 0; if (n === 0 || n === 1) return 1; let r = 1; for (let i = 2; i <= n; i++) { r *= i; if (!isFinite(r)) return Number.MAX_VALUE; } return r; }

  function analyserScores(texte) {
    if (!texte || !texte.trim()) return { butsMarques: 0, butsEncaisses: 0, nbMatchs: 0 };
    let scores = texte.split(',').map(s => s.trim()).filter(s => s.match(/^\d+-\d+$/));
    if (scores.length === 0) return { butsMarques: 0, butsEncaisses: 0, nbMatchs: 0 };
    let bM = 0, bE = 0;
    scores.forEach(s => { let [b1, b2] = s.split('-').map(Number); bM += b1; bE += b2; });
    return { butsMarques: bM / scores.length, butsEncaisses: bE / scores.length, nbMatchs: scores.length };
  }

  function analyserH2H(texte) {
    if (!texte || !texte.trim()) return { butsA: 0, butsB: 0, nbMatchs: 0, victoiresA: 0 };
    let scores = texte.split(',').map(s => s.trim()).filter(s => s.match(/^\d+-\d+$/));
    if (scores.length === 0) return { butsA: 0, butsB: 0, nbMatchs: 0, victoiresA: 0 };
    let bA = 0, bB = 0;
    scores.forEach(s => { let [b1, b2] = s.split('-').map(Number); bA += b1; bB += b2; });
    return { butsA: bA / scores.length, butsB: bB / scores.length, nbMatchs: scores.length, victoiresA: scores.filter(s => { let [b1, b2] = s.split('-').map(Number); return b1 > b2; }).length / scores.length };
  }

  function sauverProfil(prefix) {
    const nomEquipe = norm(document.getElementById(`team${prefix.toUpperCase()}`)?.value || "");
    if (!nomEquipe) return;
    const data = { xg: g(`${prefix}_xg`), xga: g(`${prefix}_xga`), possession: g(`${prefix}_possession`), classement: g(`${prefix}_classement`), scores: document.getElementById(`${prefix}_scores`)?.value || "" };
    localStorage.setItem(`equipe_${nomEquipe}`, JSON.stringify(data));
  }

  function chargerProfil(prefix) {
    const nomEquipe = norm(document.getElementById(`team${prefix.toUpperCase()}`)?.value || "");
    if (!nomEquipe) return;
    const data = JSON.parse(localStorage.getItem(`equipe_${nomEquipe}`));
    if (!data) return;
    if (data.xg) document.getElementById(`${prefix}_xg`).value = data.xg;
    if (data.xga) document.getElementById(`${prefix}_xga`).value = data.xga;
    if (data.possession) document.getElementById(`${prefix}_possession`).value = data.possession;
    if (data.classement) document.getElementById(`${prefix}_classement`).value = data.classement;
    if (data.scores) document.getElementById(`${prefix}_scores`).value = data.scores;
  }

  function getStars(score) { if (score >= 90) return '★★★★★'; if (score >= 80) return '★★★★☆'; if (score >= 70) return '★★★☆☆'; if (score >= 60) return '★★☆☆☆'; return '★☆☆☆☆'; }
  function getRank(edge, signal, clv) { let score = edge * 800 + signal * 0.3 + (clv > 0 ? 15 : 0); if (score >= 85) return { label: 'A+', class: 'rank-ap' }; if (score >= 75) return { label: 'A', class: 'rank-a' }; if (score >= 60) return { label: 'B', class: 'rank-b' }; if (score >= 40) return { label: 'C', class: 'rank-c' }; return { label: 'D', class: 'rank-d' }; }

  function runEngine() {
    sauverProfil('A'); sauverProfil('B');
    const teamA = norm(document.getElementById("teamA")?.value || "A"), teamB = norm(document.getElementById("teamB")?.value || "B");
    const dom = document.getElementById("domicile")?.value || "A", bankroll = g("bankroll") || 1000, pari = document.getElementById("pari_choisi")?.value || "1";
    const cotePrise = g("cote_prise"); let coteClose = g("cote_close");
    if (coteClose < 1.02) coteClose = cotePrise;

    let xgA = g("a_xg"), xgaA = g("a_xga"), xgB = g("b_xg"), xgaB = g("b_xga");
    let classementA = g("a_classement"), classementB = g("b_classement");
    let possessionA = g("a_possession"), possessionB = g("b_possession");
    let scoresA = analyserScores(document.getElementById("a_scores")?.value);
    let scoresB = analyserScores(document.getElementById("b_scores")?.value);
    let h2h = analyserH2H(document.getElementById("h2h_scores")?.value);

    // Impact absences manuel
    let absencesA = document.getElementById("a_absences")?.value || "";
    let absencesB = document.getElementById("b_absences")?.value || "";
    let impactAbsences = 1.0;
    if (absencesA) impactAbsences *= 0.95;
    if (absencesB) impactAbsences *= 0.95;

    let offA = (xgA * 0.25 + scoresA.butsMarques * 0.35 + h2h.butsA * 0.15 + scoresB.butsEncaisses * 0.25) * impactAbsences;
    let defA = (xgaA * 0.25 + scoresA.butsEncaisses * 0.35 + h2h.butsB * 0.15 + scoresB.butsMarques * 0.25) * impactAbsences;
    let offB = (xgB * 0.25 + scoresB.butsMarques * 0.35 + h2h.butsB * 0.15 + scoresA.butsEncaisses * 0.25) * impactAbsences;
    let defB = (xgaB * 0.25 + scoresB.butsEncaisses * 0.35 + h2h.butsA * 0.15 + scoresA.butsMarques * 0.25) * impactAbsences;

    let noteOffA = Math.round(Math.min(100, offA * 30)), noteDefA = Math.round(Math.min(100, (1 / (defA || 0.1)) * 30));
    let noteOffB = Math.round(Math.min(100, offB * 30)), noteDefB = Math.round(Math.min(100, (1 / (defB || 0.1)) * 30));

    let classementFactor = 1.0; if (classementA > 0 && classementB > 0) classementFactor = 1.0 + (classementB - classementA) * 0.02;
    let possessionFactor = 1.0; if (possessionA > 0 && possessionB > 0) possessionFactor = 1.0 + (possessionA - possessionB) * 0.005;
    let h2hFactor = 1.0; if (h2h.nbMatchs > 0) h2hFactor = 1.0 + (h2h.victoiresA - 0.5) * 0.15;
    let homeAdv = dom === 'A' ? 0.12 : (dom === 'B' ? -0.12 : 0);

    let lH = Math.min(3.5, Math.max(0.3, offA * (1.0 + homeAdv) * classementFactor * possessionFactor * h2hFactor));
    let lA = Math.min(3.5, Math.max(0.3, offB / (1.0 + homeAdv) / classementFactor / possessionFactor / h2hFactor));

    let p1P = 0, pXP = 0, p2P = 0, ov25 = 0, under25 = 0, btts = 0, allScores = [];
    for (let i = 0; i <= 5; i++) for (let j = 0; j <= 5; j++) {
      let p = (Math.exp(-lH) * Math.pow(lH, i) / fact(i)) * (Math.exp(-lA) * Math.pow(lA, j) / fact(j));
      allScores.push({ score: `${i}-${j}`, prob: p });
      if (i > j) p1P += p; else if (i === j) pXP += p; else p2P += p;
      if (i + j > 2.5) ov25 += p; else under25 += p;
      if (i > 0 && j > 0) btts += p;
    }
    let tP = p1P + pXP + p2P; p1P /= tP; pXP /= tP; p2P /= tP;
    let totOU = ov25 + under25; ov25 /= totOU; under25 /= totOU;
    allScores.sort((a, b) => b.prob - a.prob);

    let mcWins = 0, mcDraws = 0, mcLosses = 0, totalButs = 0;
    for (let s = 0; s < 10000; s++) {
      let gA = 0, gB = 0;
      for (let i = 0; i < 90; i++) { if (Math.random() < lH / 90) gA++; if (Math.random() < lA / 90) gB++; }
      if (gA > gB) mcWins++; else if (gA === gB) mcDraws++; else mcLosses++;
      totalButs += gA + gB;
    }

    let probMarche = 1 / coteClose;
    let edge1 = p1P - probMarche, edgeX = pXP - probMarche, edge2 = p2P - probMarche;
    let edgeOver = ov25 - probMarche, edgeUnder = under25 - probMarche, edgeBtts = btts - probMarche;
    let edgeSel = pari === "1" ? edge1 : (pari === "X" ? edgeX : (pari === "2" ? edge2 : (pari === "Over" ? edgeOver : (pari === "Under" ? edgeUnder : edgeBtts))));
    let probSel = pari === "1" ? p1P : (pari === "X" ? pXP : (pari === "2" ? p2P : (pari === "Over" ? ov25 : (pari === "Under" ? under25 : btts))));

    let dataQuality = Math.min(100, (scoresA.nbMatchs + scoresB.nbMatchs + h2h.nbMatchs) * 5);
    let signalConf = Math.round(Math.min(100, 50 + edgeSel * 500 + (clvStats.total > 0 ? clvStats.positif / clvStats.total * 20 : 10) + dataQuality * 0.1));
    let stars = getStars(signalConf);
    let rank = getRank(edgeSel, signalConf, parseFloat(clvStats.total > 0 ? clvStats.positif / clvStats.total : 0));

    function kelly(prob, cote) { if (cote < 1.05 || prob <= 0 || prob >= 1) return 0; let v = prob * cote - 1; if (v <= 0) return 0; return Math.min(Math.max((v / (cote - 1)) * 0.10, 0.002), 0.01); }
    let misePourcentage = kelly(probSel, cotePrise), miseEuro = misePourcentage * bankroll;
    let edgeMin = cotePrise <= 2.50 ? 0.05 : (cotePrise <= 3.00 ? 0.06 : 0.08);
    let filtreOK = edgeSel > edgeMin && signalConf >= 60 && cotePrise >= 1.70 && cotePrise <= 3.50;
    let clvVal = (cotePrise > 1.02 && coteClose > 1.02 && coteClose !== cotePrise) ? (((1 / coteClose) - (1 / cotePrise)) * 100).toFixed(2) : "0";

    let raisons = [];
    if (edgeSel <= edgeMin) raisons.push("Edge insuffisant");
    if (signalConf < 60) raisons.push("Signal insuffisant");
    if (cotePrise < 1.70) raisons.push("Cote trop basse");
    if (cotePrise > 3.50) raisons.push("Cote trop haute");
    if (dataQuality < 30) raisons.push("Manque de données");

    let marches = [{ nom: "1", edge: edge1 }, { nom: "X", edge: edgeX }, { nom: "2", edge: edge2 }, { nom: "Over 2.5", edge: edgeOver }, { nom: "Under 2.5", edge: edgeUnder }, { nom: "BTTS Oui", edge: edgeBtts }];
    let bestMarche = marches.sort((a, b) => b.edge - a.edge)[0];

    let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
      <div><strong>${teamA}</strong> vs <strong>${teamB}</strong> <span class="badge-rank ${rank.class}">${rank.label}</span></div>
      <div style="font-size:0.7rem;">${stars}</div></div>`;
    html += `<div class="grid-2" style="margin-bottom:4px;"><div style="font-size:0.5rem;">⚔️ Att: ${noteOffA}/100 | 🛡️ Déf: ${noteDefA}/100</div><div style="font-size:0.5rem;text-align:right;">⚔️ Att: ${noteOffB}/100 | 🛡️ Déf: ${noteDefB}/100</div></div>`;
    html += `<div style="font-size:0.5rem;">📊 1X2: ${(p1P * 100).toFixed(1)}% / ${(pXP * 100).toFixed(1)}% / ${(p2P * 100).toFixed(1)}% | O2.5: ${(ov25 * 100).toFixed(1)}% | BTTS: ${(btts * 100).toFixed(1)}%</div>`;
    html += `<div style="font-size:0.5rem;">🎲 Monte Carlo: A:${(mcWins / 100).toFixed(1)}% N:${(mcDraws / 100).toFixed(1)}% B:${(mcLosses / 100).toFixed(1)}% | Buts moy: ${(totalButs / 10000).toFixed(2)}</div>`;
    html += `<div style="margin-top:4px;"><strong>🎯 TOP 5 SCORES EXACTS</strong></div><div class="grid-5" style="font-size:0.45rem;">`;
    allScores.slice(0, 5).forEach(s => html += `<div>${s.score}: ${(s.prob * 100).toFixed(1)}%</div>`);
    html += `</div>`;
    html += `<div style="margin-top:4px;"><strong>🔍 MEILLEURE OPPORTUNITÉ:</strong> ${bestMarche.nom} (Edge: ${(bestMarche.edge * 100).toFixed(2)} pts)</div>`;
    html += `<div style="margin-top:6px;"><strong>📊 DÉCISION : ${pari}</strong></div>`;
    html += `<div>Modèle: ${(probSel * 100).toFixed(1)}% | Marché: ${(probMarche * 100).toFixed(1)}% | Edge: <span class="${edgeSel > edgeMin ? 'edge-pos' : 'edge-neg'}">${(edgeSel * 100).toFixed(2)} pts</span></div>`;
    html += `<div>💰 Mise: <strong>${miseEuro.toFixed(2)}€</strong> (${(misePourcentage * 100).toFixed(2)}%) | CLV: ${clvVal}%</div>`;
    html += `<div class="${filtreOK ? 'entry-ok' : 'entry-no'}">${filtreOK ? '✅ ENTREE VALUE' : '⛔ PAS D ENTREE'}</div>`;
    if (!filtreOK && raisons.length > 0) html += `<div style="font-size:0.4rem;color:#f87171;">❌ Raisons: ${raisons.join(', ')}</div>`;

    document.getElementById("resultat").innerHTML = html;
    afficherCourbe(); afficherTout();
  }

  function afficherCourbe() {
    let canvas = document.getElementById("graphBankroll"); if (!canvas) return;
    let ctx = canvas.getContext("2d"); canvas.width = canvas.offsetWidth; canvas.height = 150;
    let data = [], total = 0;
    historique.forEach(h => { if (h.profit !== null) total += h.profit; data.push(total); });
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#0a0f1a"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (data.length < 2) { ctx.fillStyle = "#64748b"; ctx.font = "10px Inter"; ctx.textAlign = "center"; ctx.fillText("2 paris minimum", canvas.width / 2, 75); return; }
    let max = Math.max(...data, 0), min = Math.min(...data, 0), range = max - min || 1;
    let zeroY = canvas.height - ((0 - min) / range) * canvas.height;
    ctx.strokeStyle = "#334155"; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(0, zeroY); ctx.lineTo(canvas.width, zeroY); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = "#00f2ff"; ctx.lineWidth = 2; ctx.beginPath();
    data.forEach((v, i) => { let x = (i / (data.length - 1)) * canvas.width, y = canvas.height - ((v - min) / range) * canvas.height; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke();
    let profitFinal = data[data.length - 1];
    ctx.fillStyle = profitFinal >= 0 ? "#4ade80" : "#f87171"; ctx.font = "bold 9px Inter";
    ctx.fillText(`${profitFinal >= 0 ? '+' : ''}${profitFinal.toFixed(2)}€`, canvas.width - 35, canvas.height - ((profitFinal - min) / range) * canvas.height - 8);
  }

  function sauvegarderAvantMatch() {
    const pari = document.getElementById("pari_choisi")?.value || "1", cotePrise = g("cote_prise"), coteClose = g("cote_close");
    const edgeT = document.getElementById("resultat")?.innerText.match(/Edge.*?([0-9.-]+) pts/)?.[1];
    let clvVal = (cotePrise > 1.02 && coteClose > 1.02) ? (((1 / coteClose) - (1 / cotePrise)) * 100).toFixed(2) : "0";
    historique.push({ date: new Date().toISOString().slice(0, 10), match: `${norm(document.getElementById("teamA")?.value || "A")} vs ${norm(document.getElementById("teamB")?.value || "B")}`, pari, cote: cotePrise, close: coteClose, edge: edgeT ? parseFloat(edgeT) / 100 : 0, clv: clvVal, resultat: null, profit: null });
    localStorage.setItem("edge_v8_histo", JSON.stringify(historique));
    afficherCourbe(); afficherTout(); alert("✅ Pari sauvegardé AVANT match.");
  }

  function sauvegarderApresMatch() {
    const res = document.getElementById("resultat_reel")?.value, butsA = g("butsA_reels"), butsB = g("butsB_reels");
    if (!res) { alert("❌ Sélectionnez un résultat."); return; }
    let dernierPari = [...historique].reverse().find(h => h.resultat === null);
    if (!dernierPari) { alert("❌ Aucun pari en attente."); return; }
    let gagne = false;
    if (dernierPari.pari === "1" && res === "1") gagne = true;
    else if (dernierPari.pari === "X" && res === "X") gagne = true;
    else if (dernierPari.pari === "2" && res === "2") gagne = true;
    else if (dernierPari.pari === "Over" && (butsA + butsB) > 2.5) gagne = true;
    else if (dernierPari.pari === "Under" && (butsA + butsB) < 2.5) gagne = true;
    else if (dernierPari.pari === "BTTS" && butsA > 0 && butsB > 0) gagne = true;
    dernierPari.resultat = res; dernierPari.profit = gagne ? dernierPari.cote - 1 : -1;
    if (parseFloat(dernierPari.clv) > 0) clvStats.positif++; else if (parseFloat(dernierPari.clv) < 0) clvStats.negatif++;
    clvStats.total++;
    localStorage.setItem("edge_v8_histo", JSON.stringify(historique));
    localStorage.setItem("edge_v8_clv", JSON.stringify(clvStats));
    afficherCourbe(); afficherTout(); runEngine();
    alert(`✅ ${gagne ? 'GAGNÉ' : 'Perdu'} | Profit: ${dernierPari.profit > 0 ? '+' + dernierPari.profit.toFixed(2) : dernierPari.profit.toFixed(2)}€`);
  }

  function afficherTout() {
    let divEnAttente = document.getElementById("pariEnAttente");
    if (divEnAttente) { let p = [...historique].reverse().find(h => h.resultat === null); divEnAttente.innerHTML = p ? `<strong style="color:#fbbf24;">⏳ Pari en attente : ${p.match} (${p.pari} @ ${p.cote})</strong>` : ""; }
    let div = document.getElementById("historique"), clvDiv = document.getElementById("clvSummary"), alerteDiv = document.getElementById("alerteRisque");
    let connus = historique.filter(h => h.resultat !== null);
    if (clvDiv && clvStats.total > 0) { let taux = clvStats.total > 0 ? (clvStats.positif / clvStats.total * 100).toFixed(1) : 0; clvDiv.innerHTML = `📈 CLV: ${clvStats.total} paris | +:${clvStats.positif} (${taux}%) | ${clvStats.total >= 50 ? (taux > 52 ? '🟢 Avantage probable' : '🟡 Incertain') : '⏳ Min 50 paris'}`; }
    let profitTotal = connus.reduce((s, h) => s + (h.profit || 0), 0), roi = connus.length > 0 ? ((profitTotal / connus.length) * 100).toFixed(2) : "0";
    if (alerteDiv) { let dp = 0; for (let i = historique.length - 1; i >= 0; i--) { if (historique[i] && historique[i].profit < 0) dp++; else break; } alerteDiv.innerHTML = dp >= 5 ? `⚠️ ${dp} pertes consécutives ! Pause risque.` : (dp >= 3 ? `🟡 ${dp} pertes récentes.` : ""); }
    if (historique.length === 0) { div.innerHTML = "Aucun pari."; return; }
    let html = `<div style="font-size:0.4rem;">📊 ${historique.length} paris | Profit: ${profitTotal.toFixed(2)}€ | ROI: ${roi}%</div>`;
    historique.slice(-5).reverse().forEach(h => html += `<div class="hist-item">${h.date} ${h.match} ${h.pari} C:${h.cote} CLV:${h.clv}% P:${h.profit !== null ? (h.profit > 0 ? '+' + h.profit.toFixed(2) : h.profit.toFixed(2)) : '?'}€ R:${h.resultat || '?'}</div>`);
    div.innerHTML = html;
  }

  function exporterCSV() { let csv = "date,match,pari,cote,close,edge,clv,resultat,profit\n"; historique.forEach(h => csv += `${h.date},${h.match},${h.pari},${h.cote},${h.close},${h.edge},${h.clv},${h.resultat || ""},${h.profit !== null ? h.profit : ""}\n`); let blob = new Blob([csv], { type: "text/csv" }); let a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "edge_v8_histo.csv"; a.click(); }

  window.addEventListener("DOMContentLoaded", () => { runEngine(); afficherCourbe(); afficherTout(); });
</script>
